<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پلنر هفتگی</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#eceaf8"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8ebf3;--hi:#fff;--lo:#c6cada;--tx:#3d4160;--mu:#8b90ab;--ac:#8f8fd6}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2d3e;--hi:#33374b;--lo:#1f2130;--tx:#e6e8f5;--mu:#9a9fbd}}
:root[data-theme="dark"]{--bg:#2a2d3e;--hi:#33374b;--lo:#1f2130;--tx:#e6e8f5;--mu:#9a9fbd}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
.raise{background:var(--bg);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);border-radius:20px}
.inset{background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);border-radius:12px}
.wrap{max-width:1500px;margin:auto;padding:22px}
.top{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:22px;margin-bottom:26px}
.card{padding:18px}.card h3{margin:0 0 12px;font-size:13px;color:var(--mu);font-weight:600}
.head h1{margin:0 0 12px;font-size:22px;font-weight:800;color:var(--ac)}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12px;color:var(--mu)}
input[type=text]{width:100%;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;padding:7px 10px}
.f input{border-radius:12px;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
button{font:inherit;color:var(--tx);border:0;cursor:pointer;background:var(--bg);border-radius:12px;padding:7px 12px;box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
button:active{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.nav span{flex:1;text-align:center;font-weight:600;font-size:13px}
.sum{display:flex;align-items:center;gap:16px}
.chart{flex:1;height:140px;display:flex;gap:8px;align-items:flex-end;padding:10px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:8px;position:relative}
.bt{width:100%;border-radius:8px;opacity:.35;position:absolute;bottom:0;transition:height .5s}
.bd{width:100%;border-radius:8px;position:absolute;bottom:0;transition:height .5s}
.ring{--p:0;--c:var(--ac);width:var(--s,110px);height:var(--s,110px);border-radius:50%;flex:none;display:grid;place-items:center;
background:conic-gradient(var(--c) calc(var(--p)*1%),transparent 0);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);position:relative}
.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
.ring b{position:relative;font-size:calc(var(--s,110px)/5.2)}
.cnt{text-align:center;font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:separate;border-spacing:0 5px}
th{font-size:11px;color:var(--mu);font-weight:600}
td{padding:0 2px;text-align:center}td.n{text-align:right;width:34%}
.hb{height:8px;border-radius:6px;overflow:hidden;min-width:50px}.hb i{display:block;height:100%;background:var(--ac);transition:width .4s}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;margin:0;cursor:pointer;vertical-align:middle;
background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);display:inline-grid;place-items:center;transition:.2s}
input[type=checkbox]:checked{background:var(--c,var(--ac));box-shadow:2px 2px 5px var(--lo),-2px -2px 5px var(--hi)}
input[type=checkbox]:checked:after{content:"✓";color:#fff;font-size:13px;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.day{padding:12px;--c:#aaa}
.dh{background:var(--c);border-radius:14px;padding:10px;text-align:center;color:#2e3150;font-weight:800;box-shadow:inset 0 0 0 99px #ffffff55;margin-bottom:14px}
.dh small{display:block;font-weight:400;font-size:12px}
.dh{box-shadow:none;background:linear-gradient(var(--c),var(--c));}
.dring{display:flex;justify-content:center;margin-bottom:12px}
.t{display:flex;align-items:center;gap:6px;margin-bottom:6px;border-radius:10px;transition:.2s}
.t input[type=text]{padding:5px 8px;font-size:13px;border-radius:10px;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.t.dn input[type=text]{text-decoration:line-through;color:var(--mu);background:color-mix(in srgb,var(--c) 22%,transparent)}
.t input[type=checkbox]{--c:var(--c)}
.add{width:100%;margin-top:4px;font-size:12px;color:var(--mu)}
.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mu)}
.foot b{color:var(--tx)}
.tabs{display:none}
@media(max-width:900px){
.wrap{padding:14px 14px 100px}
.top{grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.days{display:block}.day{display:none}.day.on{display:block}
.chart{height:110px}
.tabs{display:flex;position:fixed;bottom:0;inset-inline:0;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -6px 16px var(--lo);z-index:9}
.tabs button{flex:1;padding:8px 0;font-size:11px;border-radius:14px;line-height:1.5}
.tabs button.on{box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);color:var(--ac);font-weight:800}
.tabs button small{display:block;color:var(--mu);font-size:10px}
.day{padding:16px}.t input[type=text]{font-size:15px;padding:9px 10px}
input[type=checkbox]{width:24px;height:24px}
.hscroll{overflow-x:auto}table{min-width:420px}
}

:root{--bg:#eceaf8;--lo:#c8c9e3;--ac:#a9a6ee}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2c40;--lo:#1e1f30;--ac:#b4b1f5;--chip:#4a4870;--chipt:#dcdbff}}
:root[data-theme="dark"]{--bg:#2b2c40;--lo:#1e1f30;--ac:#b4b1f5;--chip:#4a4870;--chipt:#dcdbff}
:root[data-theme="light"]{--bg:#eceaf8;--lo:#c8c9e3;--ac:#a9a6ee}
.hr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hr h1{margin:0;background:linear-gradient(90deg,#a9a6ee,#8fc1f5,#eba7c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.th{display:flex;gap:6px}.th button{padding:5px 8px;font-size:13px}.th button.on{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.card h3{display:inline-block;background:var(--chip,#d9d8f7);color:var(--chipt,#4b4a85);padding:4px 14px;border-radius:20px;font-size:12px}
.day{background:color-mix(in srgb,var(--c) 17%,var(--bg))}
.dh{font-size:16px;box-shadow:3px 3px 8px var(--lo),-3px -3px 8px var(--hi)}
.t input[type=text]{background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.hb i{background:linear-gradient(90deg,#b7b5f0,#8fc1f5,#9fe0b8)}
.col{background:color-mix(in srgb,var(--bg) 85%,#fff0)}
.foot b{color:var(--tx)}
@media(max-width:900px){
.tabs{overflow-x:auto;gap:5px;padding-inline:8px}
.tabs button{flex:1 0 auto;min-width:0;padding:9px 5px;font-size:11px;white-space:nowrap}
.tabs button.on{background:var(--c);color:#2e3150;box-shadow:inset 2px 2px 5px #0002,3px 3px 8px var(--lo)}
.tabs button.on small{color:#2e3150aa}
}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b3e48;--hi:#4a4e5b;--lo:#2b2d35;--tx:#eceef4;--mu:#a9adbb;--ac:#b9b6f2;--chip:#555a6b;--chipt:#e8eaf5}}
:root[data-theme="dark"]{--bg:#3b3e48;--hi:#4a4e5b;--lo:#2b2d35;--tx:#eceef4;--mu:#a9adbb;--ac:#b9b6f2;--chip:#555a6b;--chipt:#e8eaf5}


.st{display:flex;gap:6px;margin-bottom:12px}.st button{flex:1;padding:6px 4px;font-size:12px}
.st button.on{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
button.on{color:var(--ac);font-weight:800}
/* ---- clay ---- */
:root[data-style=clay] .raise{border-radius:30px;box-shadow:9px 11px 24px var(--lo),-6px -6px 16px var(--hi),inset -6px -6px 12px #0000000f,inset 6px 6px 12px #ffffff55}
:root[data-style=clay] .inset,:root[data-style=clay] .f input,:root[data-style=clay] .t input[type=text],:root[data-style=clay] td.n input{border-radius:16px;box-shadow:inset 4px 4px 9px #00000018,inset -3px -3px 7px var(--hi)}
:root[data-style=clay] button{border-radius:18px;font-weight:600;box-shadow:5px 6px 13px var(--lo),-3px -3px 8px var(--hi),inset -3px -3px 7px #0000001a,inset 3px 3px 7px #ffffff55}
:root[data-style=clay] button:active,:root[data-style=clay] button.on{box-shadow:inset 4px 4px 9px #00000020,inset -3px -3px 7px var(--hi)}
:root[data-style=clay] input[type=checkbox]{border-radius:9px;box-shadow:inset 3px 3px 6px #0000001c,inset -2px -2px 5px var(--hi)}
:root[data-style=clay] input[type=checkbox]:checked{box-shadow:3px 4px 8px var(--lo),inset -3px -3px 5px #00000022,inset 3px 3px 5px #ffffff66}
:root[data-style=clay] .ring{box-shadow:inset 4px 4px 9px #0000001c,inset -3px -3px 7px var(--hi)}
:root[data-style=clay] .ring:before{box-shadow:4px 5px 10px var(--lo),inset -4px -4px 8px #0000001a,inset 4px 4px 8px #ffffff55}
:root[data-style=clay] .dh{border-radius:20px;box-shadow:5px 6px 12px var(--lo),inset -4px -4px 8px #0000001a,inset 4px 4px 8px #ffffff66}
:root[data-style=clay] .day{background:color-mix(in srgb,var(--c) 26%,var(--bg))}
:root[data-style=clay] .tabs{box-shadow:0 -8px 20px var(--lo);border-radius:24px 24px 0 0}
/* ---- liquid glass ---- */
:root[data-style=glass] body{min-height:100vh;background:radial-gradient(circle at 12% 15%,#8fc1f5cc,transparent 42%),radial-gradient(circle at 88% 25%,#eba7c9cc,transparent 42%),radial-gradient(circle at 50% 95%,#9fe0b8cc,transparent 48%),radial-gradient(circle at 80% 80%,#ffd88acc,transparent 40%),var(--bg);background-attachment:fixed}
:root[data-style=glass] .raise,:root[data-style=glass] .tabs{background:color-mix(in srgb,var(--bg) 38%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid #ffffff66;border-radius:26px;box-shadow:0 10px 30px #00000022,inset 0 1px 0 #ffffffaa,inset 0 -1px 0 #ffffff22}
:root[data-style=glass] .inset,:root[data-style=glass] .f input,:root[data-style=glass] td.n input,:root[data-style=glass] .hb{background:#ffffff30;border:1px solid #ffffff55;box-shadow:inset 0 2px 5px #00000018}
:root[data-style=glass] .t input[type=text]{background:color-mix(in srgb,var(--c) 22%,#ffffff33);border:1px solid #ffffff55;box-shadow:inset 0 1px 3px #00000015}
:root[data-style=glass] button{background:#ffffff3a;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff77;box-shadow:0 4px 14px #00000020,inset 0 1px 0 #ffffffbb}
:root[data-style=glass] button:active{transform:scale(.96)}
:root[data-style=glass] button.on{background:color-mix(in srgb,var(--ac) 40%,#ffffff30)}
:root[data-style=glass] input[type=checkbox]{background:#ffffff4d;border:1px solid #ffffff99;box-shadow:inset 0 1px 3px #00000020}
:root[data-style=glass] input[type=checkbox]:checked{background:var(--c,var(--ac));box-shadow:0 3px 8px #00000030,inset 0 1px 0 #ffffff88}
:root[data-style=glass] .ring{box-shadow:inset 0 2px 7px #00000026}
:root[data-style=glass] .ring:before{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px #00000022,inset 0 1px 0 #ffffffaa}
:root[data-style=glass] .dh{border:1px solid #ffffff88;box-shadow:0 5px 14px #00000026,inset 0 1px 0 #ffffffcc}
:root[data-style=glass] .day{background:color-mix(in srgb,var(--c) 24%,transparent)}
:root[data-style=glass] .tabs{border-radius:22px 22px 0 0}
:root[data-style=glass] .tabs button.on{background:var(--c)}

.igw{display:flex;justify-content:center;padding:18px 16px 0}
.ig{display:inline-flex;align-items:center;gap:9px;padding:8px 20px;border-radius:999px;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px;direction:ltr;letter-spacing:.2px;background:var(--bg);box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi)}
.ig:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
:root[data-style=clay] .ig{box-shadow:5px 6px 13px var(--lo),-3px -3px 8px var(--hi),inset -3px -3px 7px #0000001a,inset 3px 3px 7px #ffffff55}
:root[data-style=glass] .ig{background:#ffffff3a;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #ffffff77;box-shadow:0 4px 14px #00000020,inset 0 1px 0 #ffffffbb}
@media(max-width:900px){.igw{padding-top:14px}}
</style></head><body>
<div class="igw"><a class="ig" href="https://www.instagram.com/Malih_talk" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#igg)" stroke-width="2" aria-hidden="true"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffc27a"/><stop offset=".5" stop-color="#eba7c9"/><stop offset="1" stop-color="#8f8fe0"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="url(#igg)" stroke="none"/></svg><span>Malih_talk</span></a></div>
<div class="wrap" id="app"></div>
<div class="tabs" id="tabs"></div>
<script>
const DN=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],HL=['ش','ی','د','س','چ','پ','ج'];
const CL=['#8fc1f5','#9fe0b8','#eba7c9','#ffd88a','#b7c99c','#8ed3f7','#ffc27a'];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const jf=(d,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',o).format(d);
let TH='auto',ST='neo';try{TH=localStorage.getItem('theme')||'auto';ST=localStorage.getItem('style')||'neo'}catch(e){}
const applyTh=()=>{const r=document.documentElement;r.setAttribute('data-style',ST);TH==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',TH)};applyTh();
let S={};try{S=JSON.parse(localStorage.getItem('planner')||'{}')}catch(e){}
const save=()=>{const w_=S[key()];if(w_)w_.u=Date.now();try{localStorage.setItem('planner',JSON.stringify(S))}catch(e){}push()};
const sow=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-(x.getDay()+1)%7);return x};
let ws=sow(new Date()),ad=Math.min(6,(new Date().getDay()+1)%7);
const key=()=>ws.getFullYear()+'-'+(ws.getMonth()+1)+'-'+ws.getDate();
const W0=()=>S[key()]||(S[key()]={f:'',r:'',q:'',t:Array.from({length:7},()=>Array.from({length:8},()=>({t:'',d:0}))),h:Array.from({length:10},()=>({n:'',d:Array(7).fill(0)}))});
const W=()=>{const w=W0();while(w.h.length<10)w.h.push({n:'',d:Array(7).fill(0)});return w};
const dt=i=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d};
const pc=(a,b)=>b?Math.round(a/b*100):0;
function render(){const w=W();
const field=(k,l)=>`<label class="f">${l}<input type="text" data-f="${k}" value="${w[k].replace(/"/g,'&quot;')}"></label>`;
const range=jf(ws,{day:'numeric',month:'long'})+' تا '+jf(dt(6),{day:'numeric',month:'long',year:'numeric'});
document.getElementById('app').innerHTML=`
<div class="top">
<div class="card raise head"><div class="hr"><h1>Weekly Planner</h1><div class="th">${[['light','☀️'],['dark','🌙'],['auto','🖥️']].map(([k,i])=>`<button data-th="${k}" class="${TH==k?'on':''}">${i}</button>`).join('')}</div></div>
<div class="nav"><button data-nav="1">›</button><span>${fa(range)}</span><button data-nav="-1">‹</button></div>
<div class="st">${[['neo','نئومورفیسم'],['clay','خمیری'],['glass','شیشه‌ای']].map(([k,l])=>`<button data-st="${k}" class="${ST==k?'on':''}">${l}</button>`).join('')}</div>${field('r','🎁 پاداش')}${field('f','🎯 تمرکز هفته')}${field('q','💭 جمله انگیزشی')}</div>
<div class="card raise"><h3>خلاصه پیشرفت</h3><div class="sum"><div class="chart inset">${DN.map((_,i)=>`<div class="col"><div class="bt" id="bt${i}" style="background:${CL[i]}"></div><div class="bd" id="bd${i}" style="background:${CL[i]}"></div></div>`).join('')}</div>
<div><div class="ring" id="wr"><b id="wp">۰٪</b></div><div class="cnt" id="wc"></div></div></div></div>
<div class="card raise"><h3>ردیاب عادت</h3><div class="hscroll"><table><tr><th></th>${HL.map(h=>`<th>${h}</th>`).join('')}<th>پیشرفت</th></tr>
${w.h.map((h,i)=>`<tr><td class="n"><input type="text" class="inset" data-hn="${i}" placeholder="عادت…" value="${h.n.replace(/"/g,'&quot;')}"></td>${h.d.map((v,j)=>`<td><input type="checkbox" style="--c:${CL[j]}" data-hc="${i},${j}" ${v?'checked':''}></td>`).join('')}<td><div class="hb inset"><i id="hb${i}"></i></div><small id="hp${i}" style="font-size:10px;color:var(--mu)"></small></td></tr>`).join('')}</table></div></div></div>
<div class="days">${DN.map((n,i)=>`<section class="day raise ${i==ad?'on':''}" style="--c:${CL[i]}"><div class="dh">${n}<small>${fa(jf(dt(i),{year:'numeric',month:'2-digit',day:'2-digit'}))}</small></div>
<div class="dring"><div class="ring" style="--s:84px;--c:${CL[i]}" id="dr${i}"><b id="dp${i}"></b></div></div>
<div id="tl${i}">${w.t[i].map((t,j)=>`<div class="t ${t.d?'dn':''}"><input type="checkbox" data-tc="${i},${j}" ${t.d?'checked':''}><input type="text" data-tt="${i},${j}" placeholder="وظیفه…" value="${t.t.replace(/"/g,'&quot;')}"></div>`).join('')}</div>
<button class="add" data-add="${i}">+ وظیفه جدید</button><div class="foot"><span>تکمیل: <b id="dc${i}"></b></span><span>مانده: <b id="dm${i}"></b></span></div></section>`).join('')}</div>`;
document.getElementById('tabs').innerHTML=DN.map((n,i)=>`<button data-tab="${i}" style="--c:${CL[i]}" class="${i==ad?'on':''}">${n}<small id="tp${i}"></small></button>`).join('');
upd();sub()}
function upd(){const w=W();let D=0,T=0,mx=4;
w.t.forEach((d,i)=>{const tt=d.filter(x=>x.t.trim()),dn=tt.filter(x=>x.d).length;D+=dn;T+=tt.length;mx=Math.max(mx,tt.length)});
w.t.forEach((d,i)=>{const tt=d.filter(x=>x.t.trim()),dn=tt.filter(x=>x.d).length,p=pc(dn,tt.length);
set('dr'+i,'--p',p,1);txt('dp'+i,fa(p)+'٪');txt('dc'+i,fa(dn));txt('dm'+i,tt.length-dn?fa(tt.length-dn):(tt.length?'✅':'۰'));txt('tp'+i,fa(p)+'٪');
const a=document.getElementById('bt'+i),b=document.getElementById('bd'+i);if(a){a.style.height=tt.length/mx*100+'%';b.style.height=dn/mx*100+'%'}});
const p=pc(D,T);set('wr','--p',p,1);txt('wp',fa(p)+'٪');txt('wc','تکمیل شده '+fa(D)+' / '+fa(T));
w.h.forEach((h,i)=>{const n=h.d.filter(Boolean).length,q=pc(n,7),e=document.getElementById('hb'+i);if(e){e.style.width=q+'%';txt('hp'+i,fa(q)+'٪')}})}
function set(id,k,v){const e=document.getElementById(id);if(e)e.style.setProperty(k,v)}
function txt(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
